<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1550" viewBox="0 0 2200 1550" role="img" aria-labelledby="title desc">
  <title id="title">Archival-to-network methodological pipeline</title>
  <desc id="desc">Four-stage pipeline showing data extraction, thematic analysis, knowledge mapping, and graph refinement for historical corpus analysis.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .phase-title { font-size: 28px; font-weight: 700; letter-spacing: .4px; fill: #203f92; }
      .node-title { font-size: 28px; font-weight: 700; }
      .node-note { font-size: 20px; font-style: italic; fill: #4b5563; }
      .edge { fill: none; stroke: #374151; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14 10; marker-end: url(#arrow); }
      .support-edge { fill: none; stroke: #64748b; stroke-width: 3.25; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-soft); }
      .edge-label { font-size: 20px; font-weight: 700; font-style: italic; fill: #c2410c; }
      .data-label { font-size: 20px; font-weight: 700; fill: #203f92; }
      .label-bg { fill: #ffffff; opacity: .92; }
      .blue { stroke: #3157c6; }
      .amber { stroke: #b76b17; }
      .green { stroke: #14866d; }
      .violet { stroke: #7451b8; }
    </style>
  </defs>

  <rect width="2200" height="1550" fill="#ffffff"/>

  <rect x="50" y="50" width="2100" height="295" rx="16" fill="#edf3ff" stroke="#3157c6" stroke-width="2.5"/>
  <rect x="50" y="390" width="2100" height="300" rx="16" fill="#fff7e8" stroke="#b76b17" stroke-width="2.5"/>
  <rect x="50" y="735" width="2100" height="310" rx="16" fill="#eaf8f3" stroke="#14866d" stroke-width="2.5"/>
  <rect x="50" y="1090" width="2100" height="350" rx="16" fill="#f3ecff" stroke="#7451b8" stroke-width="2.5"/>

  <text class="phase-title" x="85" y="95">I. DATA EXTRACTION</text>
  <text class="phase-title" x="85" y="435">II. THEMATIC ANALYSIS</text>
  <text class="phase-title" x="85" y="780">III. KNOWLEDGE MAPPING</text>
  <text class="phase-title" x="85" y="1135">IV. GRAPH REFINEMENT</text>

  <rect class="blue" x="160" y="150" width="430" height="145" rx="12" fill="#ffffff" stroke-width="4"/>
  <text class="node-title" x="375" y="208" text-anchor="middle">Historical Corpus</text>
  <text class="node-note" x="375" y="253" text-anchor="middle">
    <tspan x="375" dy="0">Gazetteers, reports,</tspan>
    <tspan x="375" dy="26">treaties, travelogues</tspan>
  </text>

  <rect class="blue" x="885" y="150" width="430" height="145" rx="12" fill="#ffffff" stroke-width="4"/>
  <text class="node-title" x="1100" y="208" text-anchor="middle">Corpus TXT</text>
  <text class="node-note" x="1100" y="253" text-anchor="middle">
    <tspan x="1100" dy="0">Normalized and</tspan>
    <tspan x="1100" dy="26">OCR-repaired text</tspan>
  </text>

  <rect class="blue" x="1610" y="150" width="430" height="145" rx="12" fill="#ffffff" stroke-width="4"/>
  <text class="node-title" x="1825" y="208" text-anchor="middle">NER Extraction</text>
  <text class="node-note" x="1825" y="253" text-anchor="middle">
    <tspan x="1825" dy="0">Entities, confidence,</tspan>
    <tspan x="1825" dy="26">relevance scores</tspan>
  </text>

  <rect class="amber" x="760" y="495" width="430" height="145" rx="12" fill="#ffffff" stroke-width="4"/>
  <text class="node-title" x="975" y="553" text-anchor="middle">Selected Topics</text>
  <text class="node-note" x="975" y="598" text-anchor="middle">
    <tspan x="975" dy="0">Manual refinement</tspan>
    <tspan x="975" dy="26">of modelled themes</tspan>
  </text>

  <rect class="amber" x="1610" y="495" width="430" height="145" rx="12" fill="#ffffff" stroke-width="4"/>
  <text class="node-title" x="1825" y="553" text-anchor="middle">Topic Modeling</text>
  <text class="node-note" x="1825" y="598" text-anchor="middle">
    <tspan x="1825" dy="0">Unique historical</tspan>
    <tspan x="1825" dy="26">themes</tspan>
  </text>

  <rect class="green" x="160" y="850" width="430" height="145" rx="12" fill="#ffffff" stroke-width="4"/>
  <text class="node-title" x="375" y="908" text-anchor="middle">Co-occurrence</text>
  <text class="node-note" x="375" y="953" text-anchor="middle">
    <tspan x="375" dy="0">Context windows</tspan>
    <tspan x="375" dy="26">(+/-50 words)</tspan>
  </text>

  <rect class="green" x="885" y="850" width="430" height="145" rx="12" fill="#ffffff" stroke-width="4"/>
  <text class="node-title" x="1100" y="908" text-anchor="middle">Relation Extraction</text>
  <text class="node-note" x="1100" y="953" text-anchor="middle">
    <tspan x="1100" dy="0">Subject-relation-object</tspan>
    <tspan x="1100" dy="26">triples</tspan>
  </text>

  <rect class="green" x="1610" y="850" width="430" height="145" rx="12" fill="#ffffff" stroke-width="4"/>
  <text class="node-title" x="1825" y="908" text-anchor="middle">Knowledge Graph</text>
  <text class="node-note" x="1825" y="953" text-anchor="middle">
    <tspan x="1825" dy="0">Moral economies and</tspan>
    <tspan x="1825" dy="26">colonial bureaucracy</tspan>
  </text>

  <rect class="violet" x="160" y="1225" width="430" height="145" rx="12" fill="#ffffff" stroke-width="4"/>
  <text class="node-title" x="375" y="1283" text-anchor="middle">Config Update</text>
  <text class="node-note" x="375" y="1328" text-anchor="middle">
    <tspan x="375" dy="0">Entity aliases and</tspan>
    <tspan x="375" dy="26">type overrides</tspan>
  </text>

  <rect class="violet" x="850" y="1225" width="500" height="145" rx="12" fill="#ffffff" stroke-width="4"/>
  <text class="node-title" x="1100" y="1273" text-anchor="middle">
    <tspan x="1100" dy="0">Entity Type</tspan>
    <tspan x="1100" dy="32">Correction</tspan>
  </text>
  <text class="node-note" x="1100" y="1328" text-anchor="middle">
    <tspan x="1100" dy="0">Cross-referenced</tspan>
    <tspan x="1100" dy="26">NER types per entity</tspan>
  </text>

  <rect class="violet" x="1610" y="1225" width="430" height="145" rx="12" fill="#ffffff" stroke-width="4"/>
  <text class="node-title" x="1825" y="1273" text-anchor="middle">
    <tspan x="1825" dy="0">Interactive</tspan>
    <tspan x="1825" dy="32">Graph</tspan>
  </text>
  <text class="node-note" x="1825" y="1328" text-anchor="middle">
    <tspan x="1825" dy="0">Browser-based</tspan>
    <tspan x="1825" dy="26">HTML visualization</tspan>
  </text>

  <path class="edge" d="M 590 223 L 885 223"/>
  <rect class="label-bg" x="668" y="174" width="140" height="34" rx="8"/>
  <text class="edge-label" x="738" y="198" text-anchor="middle">script.py</text>

  <path class="edge" d="M 1315 223 L 1610 223"/>
  <rect class="label-bg" x="1376" y="174" width="172" height="34" rx="8"/>
  <text class="edge-label" x="1462" y="198" text-anchor="middle">Textrazor.py</text>

  <path class="support-edge" d="M 1100 295 L 1100 365 L 1825 365 L 1825 495"/>
  <rect class="label-bg" x="1340" y="348" width="240" height="34" rx="8"/>
  <text class="edge-label" x="1460" y="373" text-anchor="middle">Text stream / topics.py</text>

  <path class="edge" d="M 1610 568 L 1190 568"/>
  <rect class="label-bg" x="1310" y="518" width="180" height="34" rx="8"/>
  <text class="edge-label" x="1400" y="542" text-anchor="middle">Manual filtering</text>

  <path class="support-edge" d="M 975 640 L 975 720 L 375 720 L 375 850"/>
  <rect class="label-bg" x="573" y="683" width="184" height="34" rx="8"/>
  <text class="data-label" x="665" y="707" text-anchor="middle">Refined themes</text>

  <path class="support-edge" d="M 2040 223 L 2100 223 L 2100 815 L 100 815 L 100 923 L 160 923"/>
  <rect class="label-bg" x="1960" y="681" width="130" height="34" rx="8"/>
  <text class="data-label" x="2025" y="705" text-anchor="middle">NER results</text>

  <path class="edge" d="M 590 923 L 885 923"/>
  <rect class="label-bg" x="674" y="873" width="128" height="34" rx="8"/>
  <text class="edge-label" x="738" y="897" text-anchor="middle">relation.py</text>

  <path class="edge" d="M 1315 923 L 1610 923"/>

  <path class="support-edge" d="M 1825 995 L 1825 1065 L 375 1065 L 375 1225"/>
  <rect class="label-bg" x="1012" y="1051" width="176" height="34" rx="8"/>
  <text class="edge-label" x="1100" y="1076" text-anchor="middle">update_config.py</text>

  <path class="edge" d="M 590 1298 L 850 1298"/>
  <rect class="label-bg" x="600" y="1248" width="240" height="34" rx="8"/>
  <text class="edge-label" x="720" y="1272" text-anchor="middle">correct_entity_types.py</text>

  <path class="edge" d="M 1350 1298 L 1610 1298"/>
  <rect class="label-bg" x="1376" y="1248" width="208" height="34" rx="8"/>
  <text class="edge-label" x="1480" y="1272" text-anchor="middle">regenerate_html.py</text>
</svg>
